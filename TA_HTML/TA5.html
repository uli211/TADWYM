<!-- En un nuevo documento HTML, crear un formulario de registro utilizando los tags <form>, <label> e <input>.
     El formulario debe contar con un input de tipo submit para enviar la información,
      y un input de tipo reset para restablecer el formulario.-->
        
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA5</title>
</head>
<body>
    <form action="">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name">
        <br><br>
        
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email">
        
        <br><br>
        
        
        <input type="submit" value="Enviar">
        <input type="reset" value="Restablecer">
    
    
    </form>
</body>
</html>
