<!-- En un nuevo documento HTML, crear una lista ordenada (<ol>) y una lista desordenada (<ul>) dentro de la sección <body>,
     cada una con tres elementos de lista (<li>).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA2</title>
</head>
<body>
    <ol> <!-- Lista Ordenada-->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>
    <ul> <!-- Lista Desordenada-->
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
    </ul>
</body>
</html>
