<!--
Objetivo: Crear una tarjeta de perfil centrada en la página utilizando diferentes técnicas de posicionamiento en CSS.
Instrucciones:
1.	Estructura HTML:
o	Crea una tarjeta de perfil (div) que contenga los siguientes elementos:
	Una imagen (img) que represente el avatar de la persona.
	Un título (h2) con el nombre de la persona.
	Un párrafo (p) con una breve descripción o biografía.
	Un botón (button) para seguir o contactar a la persona.
2.	Estilo para la Tarjeta:
o	La tarjeta debe estar centrada tanto vertical como horizontalmente en la página.
o	Debe tener un ancho fijo de 300px y un relleno (padding) de 20px.
o	Redondea las esquinas de la tarjeta utilizando border-radius.
3.	Posicionamiento del Avatar:
o	El avatar debe estar absolutamente posicionado en la esquina superior izquierda de la tarjeta, parcialmente superpuesto con el borde superior de la tarjeta.
o	Aplica un borde circular al avatar utilizando border-radius: 50%.
4.	Centrado del Contenido:
o	El nombre, descripción y botón deben estar centrados horizontalmente dentro de la tarjeta.
o	Usa text-align: center para centrar el texto.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA17</title>
    <link rel="stylesheet" href="TA17.css">
</head>
<body>
    <div>
        <img src="../images/pruebaTA3.avif" alt="Imagen del Avatar">        
        <h2>Jaime</h2>
        <p>Jaime es una persona amable y que le gusta desarrollo web y mobile</p>
        <button class="seguir">Seguir</button>
    </div>
</body>
</html>
